<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-labelledby="mf-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mf-title">Thanks for visiting. Banoth Mahesh.</title>
  <defs>
    <linearGradient id="mf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="mf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mf-clip"><rect width="1200" height="90" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#mf-clip)">
    <rect width="1200" height="90" fill="url(#mf-bg)"/>
    <rect x="-500" y="62" width="500" height="2" fill="url(#mf-line)">
      <animate attributeName="x" values="-500;1200" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="350" y="62" width="500" height="2" fill="url(#mf-line)" opacity="0.35"/>
    <text x="600" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F8F0F3">Thanks for visiting. Let's build something useful.</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="89" rx="12" fill="none" stroke="#701A3D" stroke-opacity="0.7"/>
</svg>
