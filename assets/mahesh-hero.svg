<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="mh-title mh-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mh-title">Banoth Mahesh</title>
  <desc id="mh-desc">Banner: Banoth Mahesh, Full-Stack Developer building AI-enabled applications. Burgundy gradient with a drawn line, fine grid and orbital rings.</desc>
  <defs>
    <linearGradient id="mh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="mh-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mh-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <pattern id="mh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <radialGradient id="mh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="mh-blur" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="mh-clip"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#mh-clip)">
    <rect width="1200" height="320" fill="url(#mh-bg)"/>
    <rect width="1200" height="320" fill="url(#mh-grid)"/>
    <circle cx="960" cy="160" r="230" fill="url(#mh-glow)"/>

    <!-- moving light -->
    <rect x="-400" y="0" width="400" height="320" fill="url(#mh-sweep)">
      <animate attributeName="x" values="-400;1200" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- orbital geometry -->
    <g transform="translate(960 160)" fill="none" stroke="#C77B9B">
      <circle r="120" stroke-opacity="0.35"/>
      <circle r="78" stroke-opacity="0.25" stroke-dasharray="3 7"/>
      <ellipse rx="150" ry="46" stroke-opacity="0.2" transform="rotate(-24)"/>
      <circle r="5" fill="#E5B5C7" stroke="none"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <circle cx="120" cy="0" r="5" fill="#E5B5C7" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
        <circle cx="78" cy="0" r="3.5" fill="#C77B9B" stroke="none"/>
      </g>
    </g>

    <!-- drawn path -->
    <path d="M0 270 C 140 270 180 245 300 250 S 470 292 600 262 S 820 214 960 232 S 1120 270 1200 246"
          fill="none" stroke="url(#mh-line)" stroke-width="2" stroke-linecap="round"
          stroke-dasharray="1600" stroke-dashoffset="0" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="1600;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- text -->
    <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="1" fill="#F8F0F3">Banoth Mahesh</text>
    <text x="72" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#E5B5C7">Full-Stack Developer · AI-enabled applications</text>
    <text x="72" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#C77B9B">B.Tech CSE · National Institute of Technology Manipur</text>

    <!-- glowing underline -->
    <g>
      <rect x="72" y="160" width="340" height="3" rx="1.5" fill="#C77B9B" filter="url(#mh-blur)" opacity="0.7">
        <animate attributeName="opacity" values="0.35;0.8;0.35" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="160" width="340" height="3" rx="1.5" fill="url(#mh-line)"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#701A3D" stroke-opacity="0.7"/>
</svg>
